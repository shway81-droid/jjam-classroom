<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 이 파일은 scripts/gen-og.mjs 가 favicon.svg 에서 만든다. 손으로 고치지 마라. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1F3468"/>
      <stop offset="100%" stop-color="#0C1730"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="#FFB703"/>
  <rect x="0" y="616" width="1200" height="14" fill="#FFB703"/>
  <g transform="translate(170,200) rotate(-12)">
    <svg x="0" y="0" width="180" height="180" viewBox="0 0 100 100">
      <!-- 짬짬이 교실(모아보기) 로고. 일곱 사이트 아이콘에 공통으로 있는 시계 배지를 크게 키운 모양이다.
      흰 타일 + 네이비 시계판 + 노란 바늘 — 네이비 머리띠 위에서 또렷하도록 흰 타일로 했다.
      카드 그림(og-image)은 이 파일에서 나온다(scripts/gen-og.mjs). -->
      <rect width="100" height="100" rx="24" fill="#FFFFFF"/>
      <circle cx="50" cy="52" r="28" fill="none" stroke="#152447" stroke-width="9"/>
      <path d="M50 35 V53 L62 61" fill="none" stroke="#FFB703" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </g>
  <rect x="420" y="190" width="660" height="250" rx="36" fill="#FFFFFF"/>
  <text x="750" y="300" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="84" font-weight="900" fill="#152447">짬짬이 교실</text>
  <text x="750" y="378" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="27" font-weight="700" fill="#7A8499">수업 전후 자투리 시간을 준비 없이 바로</text>
  <text x="600" y="560" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">게임 · 퀴즈 · 낱말 · 이야기 · 영상 · 1분사회 · 그리기</text>
</svg>
