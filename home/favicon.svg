<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="짬짬이 교실">
  <!-- 짬짬이 교실(모아보기) 로고. 일곱 사이트 아이콘에 공통으로 있는 시계 배지를 크게 키운 모양이다.
       흰 타일 + 네이비 시계판 + 노란 바늘 — 네이비 머리띠 위에서 또렷하도록 흰 타일로 했다.
       카드 그림(og-image)은 이 파일에서 나온다(scripts/gen-og.mjs). -->
  <rect width="100" height="100" rx="24" fill="#FFFFFF"/>
  <circle cx="50" cy="52" r="28" fill="none" stroke="#152447" stroke-width="9"/>
  <path d="M50 35 V53 L62 61" fill="none" stroke="#FFB703" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
