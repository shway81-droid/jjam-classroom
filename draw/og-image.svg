<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 이 파일은 scripts/gen-og.mjs 가 favicon.svg 에서 만든다. 손으로 고치지 마라. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1F3468"/>
      <stop offset="100%" stop-color="#0C1730"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="#E4572E"/>
  <rect x="0" y="616" width="1200" height="14" fill="#E4572E"/>
  <g transform="translate(170,200) rotate(-12)">
    <svg x="0" y="0" width="180" height="180" viewBox="0 0 100 100">
      <!-- 가족 공통 틀: 둥근 타일 + 우상단 흰 원에 네이비 시계 배지.
      그리기의 바탕색은 코랄 #E4572E(색상각 14°), 심볼은 연필입니다(PRD 12장). -->
      <rect width="100" height="100" rx="24" fill="#E4572E"/>
      <!-- 연필: 왼쪽 위를 향합니다. 오른쪽 위는 시계 배지 자리로 비웁니다. -->
      <g>
      <polygon points="71.6,86.4 32.1,46.9 44.9,34.1 84.4,73.6" fill="#FFFFFF"/>
      <polygon points="32.1,46.9 24,26 44.9,34.1" fill="#1D3557"/>
      <polygon points="71.6,86.4 65.4,80.2 78.2,67.4 84.4,73.6" fill="#1D3557"/>
      <line x1="38.5" y1="40.5" x2="78" y2="80" stroke="#E4572E" stroke-width="2.4" opacity=".55"/>
      </g>
      <!-- 시계 배지 -->
      <circle cx="76" cy="24" r="19" fill="#FFFFFF"/>
      <circle cx="76" cy="24" r="14.5" fill="none" stroke="#1D3557" stroke-width="3.5"/>
      <path d="M 76 24 L 76 15 M 76 24 L 83 24" stroke="#1D3557" stroke-width="3.5"
      stroke-linecap="round" fill="none"/>
    </svg>
  </g>
  <rect x="420" y="190" width="660" height="250" rx="36" fill="#FFFFFF"/>
  <text x="750" y="300" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="84" font-weight="900" fill="#152447">짬짬이 그리기</text>
  <text x="750" y="378" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="27" font-weight="700" fill="#7A8499">화면이 한 획씩, 학생은 종이에 따라 그리기</text>
  <text x="600" y="560" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">교사는 시작만 누르면 끝 · 설치 없음 · 로그인 없음</text>
</svg>
