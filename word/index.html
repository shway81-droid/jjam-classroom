<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짬짬이 낱말 — 보기 없이 반 전체가 외치는 말놀이</title>
  <meta name="description" content="초성퀴즈·속담·사자성어·수수께끼를 전자칠판에 크게 띄우고 반 전체가 입으로 외치는 말놀이. 교사는 딸깍 세 번이면 됩니다. 설치·로그인 없음.">
  <meta name="theme-color" content="#E4576E">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="짬짬이 교실">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="짬짬이 낱말 — 보기 없이 반 전체가 외치는 말놀이">
  <meta property="og:description" content="문제 하나로 반 전체의 입을 엽니다. 초성퀴즈·속담·사자성어·수수께끼 800문항. 설치·로그인 없음.">
  <meta property="og:url" content="https://shway81-droid.github.io/jjam-word/">
  <meta property="og:image" content="https://shway81-droid.github.io/jjam-word/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="짬짬이 낱말 — 자투리 시간 말놀이">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="짬짬이 낱말 — 보기 없이 반 전체가 외치는 말놀이">
  <meta name="twitter:description" content="문제 하나로 반 전체의 입을 엽니다. 초성퀴즈·속담·사자성어·수수께끼 800문항. 설치·로그인 없음.">
  <meta name="twitter:image" content="https://shway81-droid.github.io/jjam-word/og-image.png?v=2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <!-- 폰트는 css/style.css의 @font-face로 자가 호스팅한다(외부 CDN 없음 → 오프라인 동작). -->
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brand-home">
      <span class="brand-icon"><img class="ic" src="favicon.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">짬짬이 낱말</span>
        <!-- 부제는 여섯 화면에 늘 따라다닌다. 그러니 "이게 뭔지"만 짧게 남긴다 —
             무엇을 하면 되는지는 홈의 띠가 맡는다(같은 말을 두 번 하지 않게). -->
        <span class="brand-sub">자투리 시간 말놀이</span>
      </span>
    </a>
    <div class="topbar-actions">
      <!-- 음소거 토글 — 출제 화면 안이 아니라 상단바에 둔다 (출제 화면 버튼은 힌트·정답·다음뿐). -->
      <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 켜고 끄기" aria-pressed="false">
        <svg class="ic-line" viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4z"/><path class="spk-wave" d="M15.5 9c1.6 1.7 1.6 4.3 0 6M18 6.8c2.8 2.9 2.8 7.5 0 10.4"/><path class="spk-x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
      </button>
      <!-- 전체화면 — 배율을 올린 칠판에서 주소창·탭 높이를 돌려받는다(게임·퀴즈와 같은 버튼). -->
      <button id="btn-fs" class="icon-btn" type="button" aria-label="전체화면" aria-pressed="false" title="전체화면">
        <svg class="ic-line" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fs-out" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
      <!-- 자매 사이트 바로가기 — 내용·스타일은 shared/jjam-switcher.js 안에 있다(상류 jjam). -->
      <div class="jjam-switch" data-site="word"></div>
    </div>
  </header>

  <main id="app">
    <!-- 수업 타이머 — 어느 놀이에도 속하지 않아 화면 밖(우상단)에 따로 산다(js/clock.js 머리말 참고).
         화면 여섯 개를 토글해도 이 패널은 그대로 있어서, 초성퀴즈를 하다 수수께끼로
         갈아타도 같은 시계가 같은 자리에서 계속 흐른다.
         숫자는 교실 뒷자리에서 읽혀야 하므로 크게 둔다 — 이 패널의 주인공은 숫자다. -->
    <aside class="clock" id="clock" data-state="idle" aria-label="수업 타이머">
      <p class="clock-time" id="clock-time" role="timer" aria-label="수업 타이머 남은 시간">0:00</p>
      <div class="clock-picks" id="clock-picks" aria-label="시간 고르기"></div>
      <div class="clock-controls">
        <button class="clock-btn" id="btn-clock" type="button">‖ 잠깐 <kbd>P</kbd></button>
        <button class="clock-btn clock-reset" id="btn-clock-reset" type="button" aria-label="타이머 지우기">↺</button>
      </div>
      <!-- 재깍재깍은 켜고 끄는 것이다 — 조용히 생각해야 하는 문항에서는 방해가 된다. -->
      <button class="clock-btn clock-tickbtn" id="btn-clock-tick" type="button" aria-pressed="false">🔔 재깍재깍</button>
    </aside>

    <!-- 1. 홈 -->
    <section id="screen-home" class="screen">
      <div class="cta-strip">
        <p class="cta-copy">어떤 <b>말놀이</b>로 시작할까요?</p>
      </div>
      <h2 class="group-title">외쳐라 말놀이</h2>
      <div class="type-grid" id="type-grid-quiz" aria-label="외쳐라 말놀이 선택"></div>
      <h2 class="group-title">지구오락실 말놀이</h2>
      <div class="type-grid" id="type-grid-arcade" aria-label="지구오락실 말놀이 선택"></div>
      <h2 class="group-title">진행 도우미</h2>
      <div class="type-grid" id="type-grid-tool" aria-label="도구형 말놀이 선택"></div>
      <footer class="site-footer">
        <p><kbd>Space</kbd> 다음 단계 · <kbd>H</kbd> 힌트 · <kbd>P</kbd> 타이머 잠깐 · <kbd>Esc</kbd> 마치기</p>
      </footer>
    </section>

    <!-- 2. 조건 선택 -->
    <section id="screen-setup" class="screen" hidden>
      <h1 class="setup-title" id="setup-title"></h1>
      <div class="setup-card">
        <div class="setup-group" id="group-level">
          <h2 id="label-level">난이도</h2>
          <div class="option-row" id="opt-level" role="radiogroup" aria-labelledby="label-level"></div>
        </div>
        <div class="setup-group" id="group-topic" hidden>
          <h2 id="label-topic">주제</h2>
          <div class="option-row" id="opt-topic" role="radiogroup" aria-labelledby="label-topic"></div>
        </div>
        <div class="setup-group" id="group-groups" hidden>
          <h2 id="label-groups">모둠 수</h2>
          <div class="option-row" id="opt-groups" role="radiogroup" aria-labelledby="label-groups"></div>
        </div>
        <div class="setup-group" id="group-seconds" hidden>
          <h2 id="label-seconds">제한 시간</h2>
          <div class="option-row" id="opt-seconds" role="radiogroup" aria-labelledby="label-seconds"></div>
        </div>
        <!-- 인물퀴즈 전용 — 정답지(번호) 순서대로 10명씩 내면 선생님이 인쇄한 정답 리스트를 따라가며 판정한다. -->
        <div class="setup-group" id="group-order" hidden>
          <h2 id="label-order">출제 순서</h2>
          <div class="option-row" id="opt-order" role="radiogroup" aria-labelledby="label-order"></div>
        </div>
        <div class="setup-group" id="group-set" hidden>
          <h2 id="label-set">세트 (정답 리스트의 번호)</h2>
          <div class="option-row" id="opt-set" role="radiogroup" aria-labelledby="label-set"></div>
        </div>
        <p class="setup-count" id="setup-count" role="status"></p>
        <!-- 인물퀴즈 전용 — 나올 인물과 정답을 새 창에서 미리 보고 엑셀(CSV)로 내려받는다. -->
        <div class="setup-people" id="group-people" hidden>
          <button class="btn btn-ghost" id="btn-people-list" type="button">📋 전체 정답 리스트 (새 창)</button>
          <span>번호 달린 정답지를 인쇄하거나, 칠판과 다른 화면에 띄워 두면 지금 문제의 정답이 떠요.</span>
        </div>
      </div>
      <div class="setup-actions">
        <button class="btn btn-ghost" id="btn-setup-back" type="button">← 유형 다시 고르기</button>
        <button class="btn btn-primary btn-big" id="btn-start" type="button">▶ 시작</button>
      </div>
    </section>

    <!-- 3. 출제 — 전자칠판 전면. 버튼은 힌트·정답·다음뿐. -->
    <section id="screen-quiz" class="screen quiz" hidden>
      <p class="quiz-topic" id="quiz-topic"></p>
      <!-- 인물퀴즈만 쓴다. 대체 텍스트는 비워 둔다 — 이름을 적으면 화면 읽기 프로그램이 정답을 읽어 준다. -->
      <img class="quiz-photo" id="quiz-photo" alt="" hidden>
      <p class="quiz-prompt" id="quiz-prompt"></p>
      <p class="quiz-hint" id="quiz-hint" hidden></p>
      <div class="quiz-answer" id="quiz-answer" hidden>
        <p class="answer-text" id="answer-text"></p>
        <p class="answer-also" id="answer-also" hidden></p>
        <p class="answer-note" id="answer-note" hidden></p>
        <p class="answer-credit" id="answer-credit" hidden><a id="answer-credit-link" target="_blank" rel="noopener"></a></p>
      </div>
      <div class="quiz-actions">
        <button class="btn btn-ghost btn-big" id="btn-hint" type="button">💡 힌트 <kbd>H</kbd></button>
        <button class="btn btn-primary btn-big" id="btn-reveal" type="button">정답 보기 <kbd>Space</kbd></button>
        <button class="btn btn-primary btn-big" id="btn-next" type="button" hidden>다음 문제 → <kbd>Space</kbd></button>
      </div>
      <div class="quiz-corner">
        <span class="quiz-count" id="quiz-count" aria-label="오늘 푼 문항 수"></span>
        <button class="btn btn-ghost btn-sm" id="btn-skip" type="button">건너뛰기</button>
        <button class="btn btn-ghost btn-sm" id="btn-quit" type="button">마치기</button>
        <!-- 인물퀴즈만 — 선생님 창(정답 리스트)을 연다. 칠판과 다른 화면에 두면 지금 문제의 정답이 뜬다. -->
        <button class="btn btn-ghost btn-sm" id="btn-people-live" type="button" hidden>📋 정답 창</button>
      </div>
    </section>

    <!-- 4. 끝말잇기 도우미 — 화면은 단어를 모른다. 차례와 시간만 맡는다. -->
    <section id="screen-chain" class="screen chain" hidden>
      <p class="chain-label" id="chain-label">시작 단어</p>
      <p class="chain-word" id="chain-word"></p>
      <p class="chain-next" id="chain-next" hidden></p>
      <p class="chain-turn" id="chain-turn" role="status"></p>
      <!-- 판이 끝나면 — 이어진 말을 전부 펼친다. 타이머·버튼이 쉬는 동안이라 화면을 다 내줘도 된다. -->
      <div class="chain-summary" id="chain-summary" hidden>
        <p class="chain-summary-title" id="chain-summary-title"></p>
        <p class="chain-summary-words" id="chain-summary-words"></p>
      </div>
      <!-- 남은 시간 — 줄어드는 링 안에 숫자. 뒷자리에서는 숫자보다 호가 먼저 읽힌다.
           0이 되어도 판을 자동으로 끝내지 않는다(js/chain.js expire 참고). -->
      <div class="chain-clock" id="chain-clock">
        <div class="chain-timer" id="chain-timer" role="timer" aria-label="남은 시간">0</div>
      </div>
      <div class="chain-log" id="chain-log" aria-label="지나간 차례"></div>
      <!-- 낱말 적기 — 적고 싶을 때만. 비워 두고 [성공]·Space 만 눌러도 예전처럼 흐른다.
           걸리는 점(첫 글자·이미 나온 말)은 알려 주기만 하고, Enter 를 한 번 더 누르면 인정한다. -->
      <div class="chain-entry" id="chain-entry">
        <input class="chain-input" id="chain-input" type="text" autocomplete="off" spellcheck="false"
               enterkeyhint="done" placeholder="말한 낱말을 적고 Enter (안 적어도 돼요)" aria-label="말한 낱말">
        <p class="chain-warn" id="chain-warn" role="alert" hidden></p>
      </div>
      <div class="chain-actions">
        <button class="btn btn-primary btn-big" id="btn-chain-ok" type="button">성공 <kbd>Space</kbd></button>
        <button class="btn btn-ghost btn-big" id="btn-chain-out" type="button">탈락</button>
        <button class="btn btn-primary btn-big" id="btn-chain-again" type="button" hidden>새 단어로 <kbd>Space</kbd></button>
      </div>
      <div class="chain-corner">
        <button class="btn btn-ghost btn-sm" id="btn-chain-pause" type="button" aria-pressed="false">‖ 잠깐 (P)</button>
        <button class="btn btn-ghost btn-sm" id="btn-chain-new" type="button">새 단어로</button>
        <button class="btn btn-ghost btn-sm" id="btn-chain-quit" type="button">마치기</button>
      </div>
    </section>

    <!-- 5. 몸으로 말해요 — 한 명만 화면을 등지고 맞힌다. 단어가 화면의 주인이다. -->
    <section id="screen-gesture" class="screen gesture" hidden>
      <p class="gesture-topic" id="gesture-topic"></p>
      <p class="gesture-word" id="gesture-word"></p>
      <div class="gesture-actions">
        <button class="btn btn-primary btn-big" id="btn-gesture-next" type="button">다음 카드 → <kbd>Space</kbd></button>
      </div>
      <div class="gesture-corner">
        <span class="gesture-count" id="gesture-count"></span>
        <button class="btn btn-ghost btn-sm" id="btn-gesture-quit" type="button">마치기</button>
      </div>
    </section>

    <!-- 6. 마무리 -->
    <section id="screen-done" class="screen done" hidden>
      <div class="done-emoji" aria-hidden="true">🎉</div>
      <h1 id="done-text"></h1>
      <div class="done-actions">
        <button class="btn btn-primary btn-big" id="btn-continue" type="button">계속하기</button>
        <button class="btn btn-ghost" id="btn-home" type="button">처음으로</button>
      </div>
    </section>

    <!-- 데이터를 못 읽었을 때 (오프라인 첫 방문 등) -->
    <section id="screen-error" class="screen" hidden>
      <div class="setup-card">
        <h1>문제를 불러오지 못했어요</h1>
        <p class="setup-count">인터넷에 연결한 뒤 새로고침해 주세요.</p>
      </div>
    </section>
  </main>

  <script src="shared/jjam-switcher.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
