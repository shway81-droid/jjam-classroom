name: 영상 검증

on:
  pull_request:
    paths: ['video/**', '.github/workflows/video.yml']
  push:
    branches: [main]
    paths: ['video/**', '.github/workflows/video.yml']
  schedule:
    # 주 1회 전수 출처 점검. PR 에서는 바뀐 영상만 보므로, 한 번 들어온 뒤
    # 나중에 삭제·비공개로 바뀐 영상은 여기서 잡는다.
    # 월요일 UTC 19:40 = KST 화요일 04:40 (다른 크론과 분을 어긋냈다).
    - cron: '40 19 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: video

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 출처 검증이 '--since 기준브랜치' 로 바뀐 영상만 골라내려면
          # 비교 대상 커밋이 있어야 한다. PR 에서만 이력을 더 받아 온다.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 데이터 검증
        run: node scripts/validate-data.mjs

      - name: 파생 데이터 동기화 확인
        run: node scripts/gen-data.mjs --check

      - name: 웹폰트 글자 커버리지 검증
        run: node scripts/check-font-coverage.mjs

      # ── 출처 검증 (유튜브 조회) ────────────────────────────────
      # 승인 채널 목록(validate-data.mjs)만으로는 승인된 채널명을 적어 두고
      # 엉뚱한 영상을 넣는 것을 막지 못한다. 여기서 실제 업로더를 대조한다.
      - name: 출처 검증 (바뀐 영상만)
        if: github.event_name == 'pull_request'
        run: node scripts/check-sources.mjs --since origin/${{ github.base_ref }}

      - name: 출처 전수 점검
        if: github.event_name != 'pull_request'
        run: node scripts/check-sources.mjs
