name: 영상 검증

on:
  pull_request:
    paths: ['video/**', '.github/workflows/video.yml']
  push:
    branches: [main]
    paths: ['video/**', '.github/workflows/video.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: video

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 데이터 검증
        run: node scripts/validate-data.mjs
      - name: 파생 데이터 동기화 확인
        run: node scripts/gen-data.mjs --check
      - name: 웹폰트 글자 커버리지 검증
        run: node scripts/check-font-coverage.mjs
