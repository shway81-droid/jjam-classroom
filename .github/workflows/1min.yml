name: 1분 수업 검증

on:
  pull_request:
    paths: ['1min/**', '.github/workflows/1min.yml']
  push:
    branches: [main]
    paths: ['1min/**', '.github/workflows/1min.yml']
  schedule:
    # 주 1회 전수 출처 점검. 한 번 들어온 뒤 삭제·비공개로 바뀐 영상을 여기서 잡는다.
    # 월요일 UTC 19:50 = KST 화요일 04:50 (다른 크론과 분을 어긋냈다).
    - cron: '50 19 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: 1min

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 출처 검증이 base 커밋의 데이터와 비교하려면 그 커밋의 트리까지 있어야 한다.
          # (video.yml 에 적힌 것과 같은 이유 — 얕은 체크아웃에서 넘어진다.)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 데이터 검증
        run: node scripts/validate-data.mjs

      - name: 파생 데이터 동기화 확인
        run: node scripts/gen-data.mjs --check

      - name: 웹폰트 글자 커버리지 검증
        run: node scripts/check-font-coverage.mjs

      # ── 출처 검증 (유튜브 조회) ────────────────────────────────
      # 이 사이트의 영상은 전부 내 채널에 올린 것이라, 승인 채널 목록 대신
      # "정말 내 채널의 살아 있는 영상인가"만 본다.
      - name: 출처 검증 (바뀐 영상만)
        if: github.event_name == 'pull_request'
        run: node scripts/check-sources.mjs --since ${{ github.event.pull_request.base.sha }}

      - name: 출처 전수 점검
        if: github.event_name != 'pull_request'
        run: node scripts/check-sources.mjs
