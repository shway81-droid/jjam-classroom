name: 발행 신호 보내기

# 이 저장소가 소스이고, 실제 발행은 기존 다섯 저장소가 한다 (주소가 저장소
# 이름에서 나오기 때문). 여기서 머지되면 그 다섯 곳에 "지금 발행해" 신호를 보내
# 몇 분 안에 사이트에 반영되게 한다.
#
# 신호를 받는 쪽은 각 저장소 `publish.yml` 의
#   repository_dispatch:
#     types: [classroom-published]
#
# 왜 토큰이 필요한가 — 워크플로 기본 토큰(GITHUB_TOKEN)은 자기 저장소 안에서만
# 통한다. 다른 저장소를 두드리려면 별도 토큰이 있어야 한다.
# `PUBLISH_TOKEN` 은 저 다섯 저장소에 대해서만 Contents 쓰기 권한을 가진
# fine-grained PAT 이다.
#
# 토큰이 없거나 만료되면 이 워크플로만 실패한다. **사이트는 죽지 않는다** —
# 각 저장소의 하루 한 번 크론이 안전망으로 남아 있어서, 최악의 경우 반영이
# 하루 늦어질 뿐이다.

on:
  push:
    branches: [main]
    # 사이트 폴더가 바뀔 때만. 문서나 CI 만 고친 머지로는 발행하지 않는다.
    paths:
      - 'game/**'
      - 'quiz/**'
      - 'video/**'
      - 'story/**'
      - 'word/**'
  # 손으로 눌러 다섯 곳을 모두 발행시킬 때 (토큰 확인용으로도 쓴다)
  workflow_dispatch:

concurrency:
  group: publish-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 바뀐 폴더를 찾으려면 이전 커밋이 필요하다

      - name: 바뀐 사이트 폴더 찾기
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "손으로 실행 → 다섯 곳 모두"
            echo "folders=game quiz video story word" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          # 새 브랜치이거나 이전 커밋을 알 수 없으면 직전 커밋과 비교한다
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD^"
          fi
          FOLDERS=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | grep -E '^(game|quiz|video|story|word)/' | cut -d/ -f1 | sort -u | tr '\n' ' ')
          echo "바뀐 폴더: ${FOLDERS:-(없음)}"
          echo "folders=$FOLDERS" >> "$GITHUB_OUTPUT"

      - name: 해당 저장소에 발행 신호 보내기
        if: steps.changed.outputs.folders != ''
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN 시크릿이 없다. 저장소 Settings → Secrets and variables → Actions 에서 등록해야 한다."
            echo "사이트는 죽지 않는다 — 각 저장소의 하루 한 번 크론이 대신 발행한다."
            exit 1
          fi

          # 폴더 이름 → 발행 저장소 이름
          repo_of() {
            case "$1" in
              game)  echo "jjam" ;;
              quiz)  echo "jjam-quiz" ;;
              video) echo "jjam-video" ;;
              story) echo "jjam-story" ;;
              word)  echo "jjam-word" ;;
            esac
          }

          FAILED=0
          for f in ${{ steps.changed.outputs.folders }}; do
            REPO=$(repo_of "$f")
            CODE=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository_owner }}/$REPO/dispatches" \
              -d '{"event_type":"classroom-published"}') || CODE=000
            # 204 = 접수됨 (본문 없음)
            if [ "$CODE" = "204" ]; then
              echo "✓ $f → $REPO 신호 보냄"
            else
              echo "::error::✗ $f → $REPO 실패 (HTTP $CODE) $(cat /tmp/resp.txt)"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "일부 저장소에 신호를 못 보냈다. 토큰이 만료됐거나 대상 저장소가 빠져 있을 수 있다."
            echo "사이트는 죽지 않는다 — 하루 한 번 크론이 안전망이다."
            exit 1
          fi
