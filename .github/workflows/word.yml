name: 낱말 검증

on:
  pull_request:
    paths: ['word/**', '.github/workflows/word.yml']
  push:
    branches: [main]
    paths: ['word/**', '.github/workflows/word.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: word

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # playwright 는 아이콘 생성(scripts/gen-icons.mjs)에만 쓰고 테스트는 쓰지 않는다.
      # 브라우저까지 내려받으면 설치가 몇 배로 길어지므로 건너뛴다.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      # v4 는 Node 20 을 대상으로 해서 러너가 경고를 낸다(곧 지원이 끊긴다). v5 는 Node 24.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: word/package-lock.json

      - run: npm ci

      - run: npm test
