name: 퀴즈 브라우저 실동작 검증

# 게임 쪽과 같은 검사다 (`game-browser.yml` 참고). 퀴즈도 합칠 때 이 검사가
# 빠져 있었다 — 원본이 `quiz/.github/workflows/browser.yml` 이라 돌지 않았다.
#
# 실행 범위
#   PR            : 그 PR이 건드린 게임만
#   main 푸시·수동 : 전 게임 (--all)
#   매주 월요일    : 전 게임

on:
  pull_request:
    paths: ['quiz/**', '.github/workflows/quiz-browser.yml']
  push:
    branches: [main]
    paths: ['quiz/**', '.github/workflows/quiz-browser.yml']
  schedule:
    - cron: '20 20 * * 0'     # 월요일 05:20 KST — 게임 쪽과 20분 어긋내 러너가 겹치지 않게
  workflow_dispatch:

concurrency:
  group: quiz-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: quiz
        run: npm ci

      - name: 크로미움 설치
        working-directory: quiz
        run: npx playwright install --with-deps chromium

      # 이 스텝만 저장소 루트에서 돈다 — git diff 경로가 루트 기준이다.
      - name: 검증 대상 결정
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -E '^quiz/games/[^/]+/' | cut -d/ -f3 | sort -u | tr '\n' ' ')
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -qE '^quiz/(shared/style\.css|shared/engine\.js|scripts/browser-verify\.js)$'; then
              echo "전 게임 공통 파일 변경 감지 → 전 게임 검증"
              echo "target=--all" >> "$GITHUB_OUTPUT"
            elif [ -n "$CHANGED" ]; then
              echo "변경된 게임: $CHANGED"
              echo "target=$CHANGED" >> "$GITHUB_OUTPUT"
            else
              echo "게임·공통 파일 변경 없음 → 건너뜀"
              echo "target=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "target=--all" >> "$GITHUB_OUTPUT"
          fi

      - name: 자동 플레이 검증
        if: steps.scope.outputs.target != ''
        working-directory: quiz
        run: node scripts/browser-verify.js ${{ steps.scope.outputs.target }} --jobs=4

      - name: 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-screenshots
          path: /tmp/game-shots
          retention-days: 7
          if-no-files-found: ignore
