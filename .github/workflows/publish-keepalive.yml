name: 발행 저장소 깨워 두기

# 발행을 맡은 일곱 저장소(jjam · jjam-quiz · jjam-video · jjam-story · jjam-word · jjam-1min · jjam-draw)는
# 소스를 이 저장소로 옮긴 뒤로 사람이 커밋하지 않는다. GitHub 는 커밋이 60일 없으면
# 크론이 걸린 워크플로를 통째로 꺼 버린다. 그러면 하루 한 번 크론만이 아니라
# `publish-dispatch.yml` 이 보내는 발행 신호(repository_dispatch)도 받지 못해 **발행이 멈춘다.**
# (2026-09 에 jjam-word 에서 "곧 꺼진다"는 알림 메일이 와서 알게 됐다.)
#
# 그래서 매달 한 번 각 저장소에 작은 기록 파일 하나를 커밋해 "활동 중"으로 만든다.
#
# - 쓰는 파일: `.github/keepalive.txt` — 발행 워크플로(push 는 publish.yml 경로만 본다)가
#   반응하지 않는 곳이다.
# - **커밋한 뒤 반드시 다시 발행한다.** jjam-quiz · jjam-story · jjam-word 는 Pages 설정이 아직
#   "main 브랜치에서 발행"이라, main 에 커밋이 들어가면 GitHub 가 main 에 얼어 있는 옛 내용을
#   다시 발행해 버린다. 2026-09-30 첫 실행 때 실제로 세 사이트가 옛 화면으로 돌아갔다.
#   그래서 커밋 뒤 그 옛 발행이 끝날 시간을 두고 여섯 곳에 발행 신호를 보내, 최신 내용으로
#   덮어쓴다. 끝으로 각 사이트 sw.js 에 최신 커밋 번호가 실렸는지 확인하고, 아니면 다시 보낸다.
#   (근본 해결은 세 저장소의 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸는 것이다.
#    바꾸고 나면 이 재발행은 게이트에 걸려 아무 일도 하지 않는다.)
# - 커밋 메시지에 `[skip ci]` 를 붙인다. 발행 저장소에도 push 마다 도는 검증 워크플로가
#   남아 있어서(verify.yml · ci.yml · browser.yml), 붙이지 않으면 얼어 있는 옛 코드를
#   매달 헛되이 검사한다. [skip ci] 가 붙어도 커밋은 커밋이라 활동으로 친다.
# - 토큰은 `PUBLISH_TOKEN` 그대로 — 저 저장소들에 대한 Contents 쓰기 권한이면 충분하다.
#   만료되면 이 워크플로가 빨간불이 되고, `token-expiry.yml` 이 미리 알린다.
#
# 이 저장소 자신도 60일 동안 커밋이 없으면 이 크론이 꺼진다. 소스 저장소라 그럴 일은
# 드물지만, 오래 쉬었다면 Actions 탭에서 이 워크플로와 token-expiry 를 다시 켜 둔다.

on:
  schedule:
    - cron: '43 18 1 * *'     # 매달 2일 03:43 KST (60일 기한 안에 두 번 돈다)
  workflow_dispatch:
  # 이 파일을 고쳐 머지하면 그 자리에서 한 번 돈다 — 고친 것이 실제로 되는지 바로 보려고.
  # (머지 뒤 손으로 Run workflow 를 누르지 않아도 된다.)
  push:
    branches: [main]
    paths: ['.github/workflows/publish-keepalive.yml']

permissions:
  contents: read

concurrency:
  group: publish-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 여섯 저장소에 기록 커밋
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN 시크릿이 없다. 저장소 Settings → Secrets and variables → Actions 에서 등록해야 한다."
            exit 1
          fi

          api() {
            curl -sS -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          FILE=".github/keepalive.txt"
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BODY=$(printf '발행 워크플로가 60일 비활동으로 꺼지지 않도록 %s/%s 의 publish-keepalive.yml 이 매달 갱신한다.\n마지막 갱신: %s\n' "$OWNER" "jjam-classroom" "$NOW" | base64 -w0)

          FAILED=0
          for REPO in jjam jjam-quiz jjam-video jjam-story jjam-word jjam-1min jjam-draw; do
            # 파일이 이미 있으면 그 sha 를 줘야 덮어쓸 수 있다
            SHA=$(api "https://api.github.com/repos/$OWNER/$REPO/contents/$FILE" | jq -r '.sha // empty')
            if [ -n "$SHA" ]; then
              DATA=$(jq -n --arg m "chore: 발행 워크플로 깨워 두기 $NOW [skip ci]" --arg c "$BODY" --arg s "$SHA" '{message:$m, content:$c, sha:$s}')
            else
              DATA=$(jq -n --arg m "chore: 발행 워크플로 깨워 두기 $NOW [skip ci]" --arg c "$BODY" '{message:$m, content:$c}')
            fi
            CODE=$(api -o /tmp/resp.json -w '%{http_code}' -X PUT \
              "https://api.github.com/repos/$OWNER/$REPO/contents/$FILE" -d "$DATA") || CODE=000
            # 200 = 고침, 201 = 새로 만듦
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "✓ $REPO 기록 커밋"
            else
              echo "::error::✗ $REPO 실패 (HTTP $CODE) $(jq -r '.message // empty' /tmp/resp.json 2>/dev/null)"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "일부 저장소에 커밋하지 못했다. 토큰이 만료됐거나 그 저장소에 대한 Contents 쓰기 권한이 빠져 있을 수 있다."
            echo "60일이 차기 전에 고치지 않으면 그 저장소의 발행 워크플로가 꺼진다."
            exit 1
          fi

      - name: 최신 내용으로 다시 발행하고 확인
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REPOS="jjam jjam-quiz jjam-video jjam-story jjam-word jjam-1min jjam-draw"

          dispatch() {
            for REPO in $1; do
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$OWNER/$REPO/dispatches" \
                -d '{"event_type":"classroom-published"}') || CODE=000
              echo "  $REPO 발행 신호: HTTP $CODE"
            done
          }

          # 발행 워크플로가 sw.js 에 넣는 번호 = jjam-classroom main 의 짧은 커밋 번호
          upstream() { git ls-remote "https://github.com/$OWNER/jjam-classroom" refs/heads/main | cut -c1-7; }
          stale() {
            local want out=""; want=$(upstream)
            for REPO in $REPOS; do
              curl -sf --max-time 20 "https://$OWNER.github.io/$REPO/sw.js?t=$(date +%s)" | grep -qF "$want" || out="$out $REPO"
            done
            echo $out
          }

          # main 커밋으로 도는 옛 발행(pages build and deployment)이 먼저 끝나게 기다린다.
          # 그보다 먼저 신호를 보내면 우리 발행 뒤에 옛 발행이 덮어쓴다.
          echo "옛 발행이 끝나기를 기다린다 (3분)"; sleep 180
          dispatch "$REPOS"

          for ROUND in 1 2 3; do
            sleep 150
            LEFT=$(stale)
            if [ -z "$LEFT" ]; then
              echo "✓ 일곱 사이트 모두 최신 내용이다 ($(upstream))"
              exit 0
            fi
            echo "아직 최신이 아닌 곳:$LEFT — 다시 신호를 보낸다 ($ROUND/3)"
            dispatch "$LEFT"
          done

          sleep 150
          LEFT=$(stale)
          if [ -n "$LEFT" ]; then
            echo "::error::최신 내용으로 돌아오지 않은 사이트:$LEFT — 그 저장소 Actions 탭에서 발행 워크플로를 Run workflow 로 돌려야 한다."
            exit 1
          fi
          echo "✓ 일곱 사이트 모두 최신 내용이다 ($(upstream))"

