<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>짬짬이 1분 수업 | 교과서 한 차시를 1분으로</title>
  <meta name="description" content="교과서 차시를 1분 영상으로. 진도 순서대로 골라 수업 도입이나 자투리 시간에 바로 트는 선생님 전용 1분 영상 모음" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="짬짬이 교실" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="짬짬이 1분 수업 — 교과서 한 차시를 1분으로" />
  <meta property="og:description" content="교과서 차시를 1분 영상으로. 진도 순서대로 골라 수업 도입이나 자투리 시간에 바로 트세요. 설치·로그인 없음." />
  <meta property="og:url" content="https://shway81-droid.github.io/jjam-1min/" />
  <meta property="og:image" content="https://shway81-droid.github.io/jjam-1min/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="짬짬이 1분 수업 — 교과서 한 차시를 1분으로" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="짬짬이 1분 수업 — 교과서 한 차시를 1분으로" />
  <meta name="twitter:description" content="교과서 차시를 1분 영상으로. 진도 순서대로 골라 바로 트세요." />
  <meta name="twitter:image" content="https://shway81-droid.github.io/jjam-1min/og-image.png" />
  <link rel="icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#152447" />
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── 소프트 3D 아이콘 스프라이트 (네이비 + 번트오렌지) ── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gO" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF9A4D"/><stop offset=".55" stop-color="#E8590C"/><stop offset="1" stop-color="#C2410C"/>
      </linearGradient>
      <linearGradient id="gN" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#33508F"/><stop offset="1" stop-color="#101C38"/>
      </linearGradient>
    </defs>
    <symbol id="i-play" viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gO)"/>
      <circle cx="50" cy="52" r="24" fill="url(#gN)"/>
      <path d="M44.5 41 L44.5 63 L63 52 Z" fill="url(#gO)"/>
      <ellipse cx="31" cy="21" rx="15" ry="7" fill="#fff" opacity=".5" transform="rotate(-18 31 21)"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gO)"/>
      <circle cx="50" cy="52" r="27" fill="url(#gN)"/>
      <circle cx="50" cy="52" r="20" fill="#FFF4EC"/>
      <path d="M50 52 L50 38" stroke="url(#gN)" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 52 L60 58" stroke="url(#gN)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="50" cy="52" r="3.5" fill="url(#gN)"/>
      <ellipse cx="30" cy="19" rx="14" ry="6" fill="#fff" opacity=".55" transform="rotate(-20 30 19)"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gN)"/>
      <path d="M20 30h26a6 6 0 0 1 6 6v40a6 6 0 0 0-6-6H20z" fill="url(#gO)"/>
      <path d="M80 30H54a6 6 0 0 0-6 6v40a6 6 0 0 1 6-6h26z" fill="#FFD6BC"/>
      <ellipse cx="31" cy="21" rx="15" ry="7" fill="#fff" opacity=".28" transform="rotate(-18 31 21)"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gN)"/>
      <circle cx="44" cy="46" r="16" stroke="url(#gO)" stroke-width="9" fill="none"/>
      <line x1="57" y1="59" x2="72" y2="74" stroke="url(#gO)" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="31" cy="21" rx="15" ry="7" fill="#fff" opacity=".28" transform="rotate(-18 31 21)"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#gO)"/>
      <path d="M34 26 L52 26 Q57 26 60.5 29.5 L76 45 Q81 50 76 55 L55 76 Q50 81 45 76 L29.5 60.5 Q26 57 26 52 L26 34 Q26 26 34 26 Z" fill="url(#gN)"/>
      <circle cx="40" cy="40" r="6" fill="url(#gO)"/>
      <ellipse cx="31" cy="18" rx="14" ry="6" fill="#fff" opacity=".5" transform="rotate(-18 31 18)"/>
    </symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="./" aria-label="짬짬이 1분 수업 홈">
      <img class="brand-logo" src="favicon.svg" alt="" width="40" height="40" />
      <span class="brand-text">
        <b>짬짬이 1분 수업</b>
        <small>교과서 한 차시를 1분으로</small>
      </span>
    </a>
    <div class="topbar-actions">
      <button id="fsBtn" class="wood-btn" type="button" title="전체화면">⛶</button>
      <!-- 자매 사이트 바로가기 — 내용·스타일은 shared/jjam-switcher.js 안에 있다 -->
      <div class="jjam-switch" data-site="1min"></div>
    </div>
  </header>

  <div class="cta-strip">
    <p class="cta-copy">
      <b>수업 도입에도, 자투리 시간에도.</b>
      교과서 차시를 1분으로 압축한 세로 영상 <b id="ctaCount">0</b>편 · 설치 없음 · 로그인 없음
    </p>
  </div>

  <main class="board">
    <!-- ── 검색이 맨 위, 그 아래로 출판사 → 교과 → 학년 → 단원 ── -->
    <section class="picker">
      <div class="searchtop">
        <svg class="searchtop-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="차시명·주제·낱말로 찾기 (예: 고인돌, 삼국, 불국사)"
          autocomplete="off" enterkeyhint="search" aria-label="차시 검색" />
        <button id="searchClear" class="search-clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
      </div>
      <div class="pick-divider"></div>
      <div class="pick-group">
        <div class="pick-head">
          <span class="pick-label">출판사</span>
        </div>
        <div id="pubCards" class="opt-cards"></div>
      </div>
      <div class="pick-group">
        <div class="pick-head">
          <span class="pick-label">교과</span>
        </div>
        <div id="subjectCards" class="opt-cards"></div>
      </div>
      <div class="pick-group">
        <div class="pick-head">
          <span class="pick-label">학년</span>
        </div>
        <div id="gradeCards" class="opt-cards"></div>
      </div>
      <div class="pick-group">
        <div class="pick-head">
          <span class="pick-label">단원</span>
        </div>
        <div id="unitCards" class="opt-cards"></div>
      </div>
    </section>

    <!-- ── 단원 → 차시 (교과서 진도 순서) ── -->
    <section id="units" class="units"></section>
    <p id="emptyMsg" class="empty-msg" hidden>찾는 차시가 없어요. 검색어를 바꿔 보세요.</p>
  </main>

  <footer class="footer">
    <p>짬짬이 1분 수업 · 교과서 차시를 1분으로 · <span id="footCount"></span></p>
    <p class="footer-note">영상은 NotebookLM 으로 만들고 사람이 교과서와 대조했습니다. 화면과 내레이션은 AI 생성물입니다.</p>
  </footer>

  <!-- ── 세로 재생 모달 ── -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="modal-close" data-close type="button" aria-label="닫기">✕</button>
      <!-- 9:16 세로 영상을 가운데에 그대로 띄운다 (레터박스 없음) -->
      <div id="mPlayer" class="modal-player"></div>
      <div class="modal-side">
        <div class="modal-meta">
          <span id="mBook" class="pill"></span>
          <span id="mUnit" class="pill pill-unit"></span>
          <span id="mTime" class="pill pill-time"></span>
        </div>
        <h3 id="mTitle" class="modal-title"></h3>
        <p id="mDesc" class="modal-desc"></p>
        <div class="kw">
          <h4 class="kw-head"><svg class="s3d s3d-18" aria-hidden="true"><use href="#i-tag"/></svg>이 차시의 핵심 낱말</h4>
          <ul id="mKeywords" class="kw-list"></ul>
        </div>
        <div class="modal-actions">
          <a id="mYtBtn" class="gold-btn ghost" target="_blank" rel="noopener">▶ 유튜브에서 보기</a>
          <button id="mShareBtn" class="gold-btn ghost" type="button">🔗 공유</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="shared/jjam-switcher.js" defer></script>
</body>
</html>
