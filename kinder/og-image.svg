<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 이 파일은 scripts/gen-og.mjs 가 favicon.svg 에서 만든다. 손으로 고치지 마라. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1F3468"/>
      <stop offset="100%" stop-color="#0C1730"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="14" fill="#3FA34D"/>
  <rect x="0" y="616" width="1200" height="14" fill="#3FA34D"/>
  <g transform="translate(170,200) rotate(-12)">
    <svg x="0" y="0" width="180" height="180" viewBox="0 0 100 100">
      <!-- 짬짬이 유치원 — 초록 바탕에 카드 속 토끼. 카드 그림과 같은 그림체(굵은 진갈색 테두리). -->
      <g transform="scale(1.5625)">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#3FA34D"/>
      <g stroke="#3B2F2F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="24" cy="19" rx="6" ry="13" fill="#fff"/>
      <ellipse cx="40" cy="19" rx="6" ry="13" fill="#fff"/>
      <ellipse cx="32" cy="40" rx="19" ry="16" fill="#fff"/>
      </g>
      <ellipse cx="24" cy="20" rx="2.6" ry="8" fill="#FFB5C2"/>
      <ellipse cx="40" cy="20" rx="2.6" ry="8" fill="#FFB5C2"/>
      <circle cx="25" cy="38" r="2.6" fill="#3B2F2F"/>
      <circle cx="39" cy="38" r="2.6" fill="#3B2F2F"/>
      <path d="M29.5 44 L34.5 44 L32 47 Z" fill="#FF8FA3"/>
      <ellipse cx="20" cy="45" rx="3.5" ry="2.2" fill="#FF8FA3" opacity=".6"/>
      <ellipse cx="44" cy="45" rx="3.5" ry="2.2" fill="#FF8FA3" opacity=".6"/>
      </g>
    </svg>
  </g>
  <rect x="420" y="190" width="660" height="250" rx="36" fill="#FFFFFF"/>
  <text x="750" y="300" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="84" font-weight="900" fill="#152447">짬짬이 유치원</text>
  <text x="750" y="378" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="27" font-weight="700" fill="#7A8499">글자를 몰라도 그림만 보면 알아요</text>
  <text x="600" y="560" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">그림 보고 몸으로 말해요 · 설치 없음 · 로그인 없음</text>
