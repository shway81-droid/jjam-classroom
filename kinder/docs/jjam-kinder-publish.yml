# ─────────────────────────────────────────────────────────────────────────
# 이 파일은 발행 저장소 shway81-droid/jjam-kinder 의 .github/workflows/publish.yml 로 쓸 원본이다.
# 이 저장소(jjam-classroom)에서는 docs/ 안에 있어서 돌지 않는다.
# jjam-draw 의 publish.yml 을 본떴다(2026-11-12).
# ─────────────────────────────────────────────────────────────────────────
name: 발행 — jjam-classroom 에서 받아 배포

# 이 사이트의 소스는 shway81-droid/jjam-classroom 의 `kinder/` 폴더다.
# 이 저장소의 main 은 발행되는 내용이 아니다 — 주소(github.io/jjam-kinder/)가 저장소 이름에서
# 나오기 때문에 발행만 여기 둔다. Pages Source 는 반드시 **GitHub Actions** 여야 한다
# ("main 브랜치에서 발행"이면 이 저장소에 커밋이 생길 때마다 엉뚱한 내용이 발행된다 — 2026-09-30 사고).
#
# 언제 도는가
#   - jjam-classroom 에서 kinder/ 가 바뀌어 머지되면 발행 신호(repository_dispatch)
#   - 하루 한 번(KST 04시경) — 상류가 그대로면 몇 초 만에 건너뛴다
#   - 즉시 반영하려면 Actions 탭에서 "Run workflow"

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  schedule:
    # 발행 저장소마다 분을 어긋낸다 (UTC 19:50 = KST 04:50)
    - cron: '50 19 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [classroom-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 상류(jjam-classroom) 받기
        uses: actions/checkout@v4
        with:
          repository: shway81-droid/jjam-classroom
          ref: main
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 카드·그림·오프라인 목록 검증. 상류 CI 가 이미 보지만, 발행 직전에 한 번 더.
      - name: 검증
        run: cd src/kinder && npm test

      # scripts/·docs/·*.md·package.json 은 배포하지 않는다.
      - name: 배포용 폴더를 만들고 서비스워커 캐시 이름을 상류 커밋으로 갱신
        id: build
        run: |
          SHA=$(git -C src rev-parse --short HEAD)
          rm -rf site && mkdir site
          cd src/kinder
          cp index.html sw.js manifest.json favicon.svg og-image.png ../../site/
          cp -r css js data assets shared ../../site/
          cd ../..
          touch site/.nojekyll
          sed -i "s|var CACHE = '[^']*';|var CACHE = 'jjam-kinder-${SHA}';|" site/sw.js
          grep -q "jjam-kinder-${SHA}" site/sw.js || { echo "::error::sw.js 캐시 이름 치환 실패"; exit 1; }
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "상류 $SHA 로 빌드함"

      - name: 이미 같은 것이 올라가 있으면 건너뛴다
        id: gate
        run: |
          LIVE=$(curl -sf --max-time 20 https://shway81-droid.github.io/jjam-kinder/sw.js || true)
          if printf '%s' "$LIVE" | grep -qF "${{ steps.build.outputs.sha }}"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "이미 상류 ${{ steps.build.outputs.sha }} 가 올라가 있다 — 건너뛴다"
          fi

      - name: Configure Pages
        if: steps.gate.outputs.skip != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        if: steps.gate.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
