<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짬짬이 유치원 — 그림 보고 몸으로 말해요</title>
  <meta name="description" content="글자를 아직 못 읽어도 그림만 보면 알아요. 유치원 아이들과 전자칠판으로 하는 몸으로 말해요·무엇일까요 놀이. 설치·로그인 없음.">
  <meta name="theme-color" content="#3FA34D">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="짬짬이 교실">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="짬짬이 유치원 — 그림 보고 몸으로 말해요">
  <meta property="og:description" content="글자를 아직 못 읽어도 그림만 보면 알아요. 그림 카드로 하는 몸으로 말해요·무엇일까요 놀이. 설치·로그인 없음.">
  <meta property="og:url" content="https://shway81-droid.github.io/jjam-kinder/">
  <meta property="og:image" content="https://shway81-droid.github.io/jjam-kinder/og-image.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="짬짬이 유치원 — 그림 보고 몸으로 말해요">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="짬짬이 유치원 — 그림 보고 몸으로 말해요">
  <meta name="twitter:description" content="글자를 아직 못 읽어도 그림만 보면 알아요. 그림 카드로 하는 몸으로 말해요·무엇일까요 놀이. 설치·로그인 없음.">
  <meta name="twitter:image" content="https://shway81-droid.github.io/jjam-kinder/og-image.png?v=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <!-- 폰트는 css/style.css 의 @font-face 로 자가 호스팅한다(외부 CDN 없음 → 오프라인 동작). -->
  <link rel="preload" href="assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brand-home">
      <span class="brand-icon"><img class="ic" src="favicon.svg" alt="" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">짬짬이 유치원</span>
        <span class="brand-sub">그림 보고 몸으로 말해요</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 켜고 끄기" aria-pressed="false">
        <svg class="ic-line" viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5v5h3.2L12 19V5L7.2 9.5H4z"/><path class="spk-wave" d="M15.5 9c1.6 1.7 1.6 4.3 0 6M18 6.8c2.8 2.9 2.8 7.5 0 10.4"/><path class="spk-x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
      </button>
      <button id="btn-fs" class="icon-btn" type="button" aria-label="전체화면" aria-pressed="false" title="전체화면">
        <svg class="ic-line" viewBox="0 0 24 24" aria-hidden="true"><path class="fs-in" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fs-out" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- 첫 화면 — 놀이 고르기 + 주제 고르기 -->
    <section id="screen-home" class="screen home">
      <p class="home-lead">글자를 몰라도 <b>그림만 보면</b> 알아요</p>

      <div class="modes" role="group" aria-label="놀이 고르기">
        <button class="mode" type="button" data-mode="gesture">
          <img class="mode-art" src="assets/cards/rabbit.svg" alt="" aria-hidden="true">
          <span class="mode-name">몸으로 말해요</span>
          <span class="mode-desc">한 친구는 뒤돌아 서고,<br>나머지 친구들이 몸으로 알려 줘요</span>
        </button>
        <button class="mode" type="button" data-mode="guess">
          <img class="mode-art" src="assets/cards/icecream.svg" alt="" aria-hidden="true">
          <span class="mode-name">무엇일까요?</span>
          <span class="mode-desc">그림을 보고 다 같이<br>이름을 크게 외쳐요</span>
        </button>
      </div>

      <div class="topics-wrap">
        <p class="topics-title">어떤 그림으로 할까요? <span class="topics-count" id="topics-count"></span></p>
        <div class="topics" id="topics" role="group" aria-label="주제 고르기"></div>
      </div>
    </section>

    <!-- 카드 화면 — 두 놀이가 함께 쓴다 -->
    <section id="screen-card" class="screen card-screen" hidden>
      <div class="card" id="card">
        <p class="card-topic" id="card-topic"></p>
        <img class="card-art" id="card-art" src="" alt="">
        <p class="card-word" id="card-word"></p>
        <p class="card-ask" id="card-ask" hidden>무엇일까요?</p>
        <p class="card-hint" id="card-hint" hidden></p>
      </div>

      <div class="card-actions">
        <button class="btn btn-soft" id="btn-hint" type="button">💡 몸짓 힌트</button>
        <button class="btn btn-primary btn-big" id="btn-next" type="button">다음 카드 → <kbd>Space</kbd></button>
      </div>

      <div class="card-corner">
        <span class="card-count" id="card-count"></span>
        <button class="btn btn-ghost btn-sm" id="btn-quit" type="button">처음으로</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
